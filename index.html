<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="calculator">
        <div id="equation"></div>
        <input type="text" id="result-box" value="0" readonly>
        <div class="buttons">
            <button class="operator">AC</button>
            <button class="operator">C</button>
            <button class="operator">%</button>
            <button class="operator">/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator" >+</button>

            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="operator">=</button>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
